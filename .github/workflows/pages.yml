# Publica la app de pacing (carpeta pacing/) en GitHub Pages cada vez que cambia main.
name: Publicar Pacing
on:
  push:
    branches: [main]
    paths: ['pacing/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pacing
      - id: deployment
        uses: actions/deploy-pages@v4
